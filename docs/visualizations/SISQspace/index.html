<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIQS in two neighbourhoods</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;          /* inherit the embedding page's background */
      color: #000;
      font-family: sans-serif;
    }
    canvas { position: absolute; top: 0; left: 0; display: block; background: transparent; }

    /* every piece of text is real HTML, so it stays crisp at any zoom or pixel ratio */
    #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    #overlay > * { position: absolute; white-space: nowrap; }

    .circle-title {
      font-size: 1.45rem;
      font-weight: 700;
      transform: translate(-50%, -100%);
    }
    .circle-params {
      font-family: monospace;
      font-size: 1.02rem;
      transform: translate(-50%, 0);
    }
    .circle-counts {
      font-family: monospace;
      font-size: 1.2rem;
      transform: translate(-50%, 0);
    }

    /* text top-left, buttons top-right, so neither steals height from the circles */
    #ui, #controls {
      position: absolute;
      top: 20px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 7px #fff, 0 0 7px #fff, 0 0 4px #fff;
    }
    #ui { left: 40px; }
    #controls { right: 40px; text-align: right; }
    #ui > *, #controls > * { pointer-events: auto; }

    .headline { font-size: 2rem; font-weight: 700; line-height: 1.15; }
    .verdict { font-size: 1.15rem; margin-top: 5px; font-weight: 600; min-height: 1.3em; }
    .legend { font-size: 1.02rem; margin-top: 8px; }

    button {
      background: transparent;
      border: 1px solid rgba(0,0,0,0.45);
      color: #000;
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      display: inline-block;
      margin-left: 8px;
      margin-bottom: 8px;
      text-shadow: none;
    }
    button:hover { background: rgba(0,0,0,0.08); }

    kbd {
      background-color: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.35);
      border-radius: 4px;
      color: #000;
      display: inline-block;
      font-size: 0.8em;
      font-family: monospace;
      padding: 1px 5px;
      margin: 0 2px;
      line-height: 1.2;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlay"></div>

  <div id="ui">
    <div class="headline" id="headline">Commuting rate D = 0.10</div>
    <div class="verdict" id="verdict"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div id="controls">
    <button id="btn-d-plus">more commuting <kbd>&uarr;</kbd> <kbd>W</kbd></button>
    <button id="btn-d-minus">less <kbd>&darr;</kbd> <kbd>S</kbd></button>
    <br>
    <button id="btn-seed">re-seed infection <kbd>&#9251;</kbd></button>
    <button id="btn-reset">reset <kbd>R</kbd></button>
  </div>

  <script src="index.js"></script>
</body>
</html>
